name: Instaladores

# Gera os instaladores a cada push (versões de teste, guardadas 90 dias em
# Actions) e quando pedido à mão. GERAR NÃO É PUBLICAR: a versão oficial
# (release) só sai quando o criador pede, rodando este workflow à mão com
# "publicar = sim" (publica na hora) ou "rascunho" (só ele vê, para revisar).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publicar:
        description: "Publicar a versão oficial? (nao / rascunho / sim)"
        required: true
        default: "nao"
        type: choice
        options: ["nao", "rascunho", "sim"]

concurrency:
  group: instaladores-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TAURI_CLI: "@tauri-apps/cli@2"

jobs:
  windows:
    name: Windows (NSIS, por usuário)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: DLLs do Visual C++ (vão junto no instalador)
        shell: pwsh
        run: ./scripts/copiar-vcrt.ps1
      - name: Gerar instalador
        working-directory: app/src-tauri
        run: npx --yes ${{ env.TAURI_CLI }} build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: ignis-windows
          path: target/release/bundle/nsis/*.exe
          retention-days: 90

  linux:
    name: Linux (.deb e AppImage)
    # Ubuntu 22.04: glibc mais antiga = roda em mais distros
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Dependências
        timeout-minutes: 30
        run: |
          ./scripts/apt-instalar.sh libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file
      - name: Gerar .deb e AppImage
        working-directory: app/src-tauri
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "true"
        run: npx --yes ${{ env.TAURI_CLI }} build --bundles deb,appimage
      - uses: actions/upload-artifact@v4
        with:
          name: ignis-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
          retention-days: 90

  rpm-fedora:
    name: Fedora 44 (RPM)
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 60
    steps:
      - name: Ferramentas e dependências do Fedora
        run: |
          dnf install -y git gcc gcc-c++ make curl file nodejs npm rpm-build \
            webkit2gtk4.1-devel libayatana-appindicator-gtk3-devel librsvg2-devel openssl-devel libxdo-devel
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
      - name: Gerar RPM
        working-directory: app/src-tauri
        run: npx --yes ${{ env.TAURI_CLI }} build --bundles rpm
      - uses: actions/upload-artifact@v4
        with:
          name: ignis-fedora
          path: target/release/bundle/rpm/*.rpm
          retention-days: 90

  flatpak:
    name: Flatpak (Fedora Atomic e outras distros)
    needs: linux
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ignis-linux
          path: pacotes
      - name: flatpak-builder
        timeout-minutes: 30
        run: |
          ./scripts/apt-instalar.sh flatpak flatpak-builder
          # o Ubuntu 24.04 bloqueia namespaces de usuário (usados pelo sandbox do flatpak-builder)
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - name: Gerar Flatpak
        run: |
          DEB=$(ls pacotes/deb/*.deb | head -1)
          ./packaging/flatpak/build.sh "$DEB" "$PWD/Ignis.flatpak"
      - uses: actions/upload-artifact@v4
        with:
          name: ignis-flatpak
          path: Ignis.flatpak
          retention-days: 90

  manifesto:
    name: Manifesto de atualizações
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Gerar atualizacoes.json
        run: |
          VERSAO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          python3 scripts/gerar_atualizacoes.py "$VERSAO" atualizacoes.json
      - uses: actions/upload-artifact@v4
        with:
          name: ignis-atualizacoes
          path: atualizacoes.json
          retention-days: 90

  publicar:
    name: Versão oficial (só a pedido)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.publicar != 'nao'
    needs: [windows, linux, rpm-fedora, flatpak, manifesto]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: saida
          merge-multiple: true
      - name: Nomes por sistema, somas SHA-256 e notas
        id: v
        run: |
          VERSAO=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          LLAMA=$(python3 -c 'import json; print(json.load(open("manifest/motores.json"))["llama_cpp"]["versao"])')
          echo "versao=$VERSAO" >> "$GITHUB_OUTPUT"
          mkdir release
          um() { f=$(find saida -type f -name "$1" | head -1); [ -n "$f" ] || { echo "faltou $1"; exit 1; }; cp "$f" "release/$2"; }
          um '*-setup.exe'   Ignis-Windows.exe
          um '*.rpm'         Ignis-Fedora.rpm
          um '*.flatpak'     Ignis-Flatpak.flatpak
          um '*.deb'         Ignis-Ubuntu-Debian.deb
          um '*.AppImage'    Ignis-Linux.AppImage
          um 'atualizacoes.json' atualizacoes.json
          # Matsu OS: o mesmo Flatpak, já reconhece o sistema e abre com o visual dele
          cp release/Ignis-Flatpak.flatpak release/Ignis-Matsu-OS.flatpak
          # instalador pelo terminal (descobre o sistema e baixa a versão certa)
          cp scripts/instalar.sh release/instalar.sh
          (cd release && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          sed -e "s/{{VERSAO}}/$VERSAO/g" -e "s/{{LLAMA}}/$LLAMA/g" .github/release/notas.md > notas.md
      - name: Publicar
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event.inputs.publicar == 'rascunho' }}
          make_latest: "true"
          tag_name: v${{ steps.v.outputs.versao }}
          target_commitish: ${{ github.sha }}
          name: Ignis ${{ steps.v.outputs.versao }}
          body_path: notas.md
          files: release/*

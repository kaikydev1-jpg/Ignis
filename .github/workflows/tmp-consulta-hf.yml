name: tmp consulta HF (apagar antes do PR)
on:
  push:
    paths: [".github/workflows/tmp-consulta-hf.yml"]
jobs:
  consultar:
    runs-on: ubuntu-24.04
    steps:
      - name: Metadados
        run: |
          for r in Qwen/Qwen3-VL-4B-Instruct-GGUF ggml-org/Qwen3-VL-4B-Instruct-GGUF Qwen/Qwen3-VL-2B-Instruct-GGUF leejet/Z-Image-Turbo-GGUF unsloth/Qwen3-4B-Instruct-2507-GGUF Comfy-Org/z_image_turbo black-forest-labs/FLUX.1-schnell BricksDisplay/Chatterbox-Multilingual-TTS-GGUF Tongyi-MAI/Z-Image-Turbo; do
            echo "=== $r"
            curl -fsSL "https://huggingface.co/api/models/$r" -o info.json || { echo "falhou info"; continue; }
            python3 -c "import json;d=json.load(open('info.json'));print('sha',d.get('sha'),'gated',d.get('gated'),'license',(d.get('cardData') or {}).get('license'),(d.get('cardData') or {}).get('license_name'))"
            curl -fsSL "https://huggingface.co/api/models/$r/tree/main?recursive=1" -o tree.json || { echo "falhou tree"; continue; }
            python3 -c "
          import json
          for f in json.load(open('tree.json')):
              if f.get('type')!='file': continue
              n=f['path']
              if not any(n.endswith(x) for x in ('.gguf','.safetensors','.sft')): continue
              l=f.get('lfs') or {}
              print(n, f.get('size'), l.get('oid'))
          "
          done

[workspace]
resolver = "2"
members = [
    "crates/ignis-core",
    "crates/ignis-cli",
    "crates/fake-llama-server",
    "app/src-tauri",
]

[workspace.package]
version = "0.3.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
repository = "https://github.com/kaikydev1-jpg/Ignis"

[workspace.dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
bytes = "1"
axum = "0.8"
tower = { version = "0.5", features = ["util"] }
http = "1"
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "stream", "json", "http2", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
dirs = "6"
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
strip = true
